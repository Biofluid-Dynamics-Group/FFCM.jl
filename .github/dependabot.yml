# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
  # The julia scan is workspace-aware: scanning the repository root resolves
  # the whole [workspace] and proposes edits to member Project.tomls, so a
  # single root directory covers test/, docs/, and benchmark/ too.
  - package-ecosystem: "julia"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      julia-dependencies:
        patterns:
          - "*"
